name: nifty-oi-tracker

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test = sirf NSE access check | run = asli tracker"
        default: "test"
  schedule:
    # GitHub cron UTC me hota hai (IST = UTC + 5:30). GitHub scheduled runs ko 30-40 min late kar sakta hai,
    # isliye har session ke liye jaldi wala + backup trigger hai (concurrency se ek hi chalta hai).
    - cron: "37 2 * * 1-5"   # 08:07 IST  session 1 (13:30 tak)
    - cron: "7 3 * * 1-5"    # 08:37 IST  session 1 backup
    - cron: "37 6 * * 1-5"   # 12:07 IST  session 2 (13:32 par handover, 15:42 tak)
    - cron: "7 7 * * 1-5"    # 12:37 IST  session 2 backup

concurrency:
  group: nifty-${{ (github.event.schedule == '37 2 * * 1-5' || github.event.schedule == '7 3 * * 1-5') && 'session1' || 'session2' }}
  cancel-in-progress: false

env:
  TZ: Asia/Kolkata

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests pandas openpyxl matplotlib numpy

      - name: Today's date
        run: echo "D=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      # ---- TEST MODE: sirf dekhta hai ki GitHub se NSE khulta hai ya nahi ----
      - name: NSE access test
        if: github.event.inputs.mode == 'test'
        run: python nse_to_excel.py --test

      # ---- RUN MODE ----
      # Session 2 jaldi start hoke taiyar baithta hai, session 1 ka history-cache save hone ke baad (13:32) aage badhta hai
      - name: Wait for session 1 handover (13:32 IST)
        if: github.event.schedule == '37 6 * * 1-5' || github.event.schedule == '7 7 * * 1-5'
        run: |
          target=$(date -d "13:32" +%s); now=$(date +%s)
          if [ "$now" -lt "$target" ]; then sleep $((target-now)); fi

      - name: Restore today's chart history
        if: github.event.inputs.mode != 'test'
        uses: actions/cache/restore@v4
        with:
          path: oi_history_*.pkl
          key: hist-${{ env.D }}-${{ github.run_id }}
          restore-keys: hist-${{ env.D }}-

      - name: Run tracker
        if: github.event.inputs.mode != 'test'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          case "${{ github.event.schedule }}" in
            "37 2 * * 1-5"|"7 3 * * 1-5") python run_actions.py --until 13:30 ;;
            *) python run_actions.py --until 15:42 ;;
          esac

      - name: Save today's chart history
        if: github.event.inputs.mode != 'test' && always()
        uses: actions/cache/save@v4
        with:
          path: oi_history_*.pkl
          key: hist-${{ env.D }}-${{ github.run_id }}
