name: nifty-oi-tracker

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test = sirf NSE access check | run = asli tracker"
        default: "test"
  schedule:
    # GitHub cron UTC me hota hai (IST = UTC + 5:30).
    # GitHub scheduled runs ko 50-80 min tak late kar raha hai (27-Oct/28-Oct me dekha gaya),
    # isliye trigger bahut jaldi rakhe hain aur andar "wait" steps hain.
    # Handover 12:30/12:32 IST par: Session 1 = open se 12:30, Session 2 = 12:32 se close.
    - cron: "37 1 * * 1-5"   # 07:07 IST  session 1 (09:10 tak wait, 12:30 tak chalta)
    - cron: "7 2 * * 1-5"    # 07:37 IST  session 1 backup
    - cron: "37 4 * * 1-5"   # 10:07 IST  session 2 (12:32 par handover, 15:42 tak)
    - cron: "7 5 * * 1-5"    # 10:37 IST  session 2 backup

concurrency:
  group: nifty-${{ (github.event.schedule == '37 1 * * 1-5' || github.event.schedule == '7 2 * * 1-5') && 'session1' || 'session2' }}
  cancel-in-progress: false

env:
  TZ: Asia/Kolkata

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests pandas openpyxl matplotlib numpy

      - name: Today's date
        run: echo "D=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      # ---- TEST MODE: sirf dekhta hai ki GitHub se NSE khulta hai ya nahi ----
      - name: NSE access test
        if: github.event.inputs.mode == 'test'
        run: python nse_to_excel.py --test

      # ---- RUN MODE ----
      # Session 1 jaldi start hota hai, market open (09:10 IST) tak wait karta hai (STARTED msg open ke aas-paas aaye)
      - name: Wait for market open (09:10 IST) - session 1
        if: github.event.schedule == '37 1 * * 1-5' || github.event.schedule == '7 2 * * 1-5'
        run: |
          target=$(date -d "09:10" +%s); now=$(date +%s)
          if [ "$now" -lt "$target" ]; then sleep $((target-now)); fi

      # Session 2 jaldi start hoke taiyar baithta hai, session 1 ka history-cache save hone ke baad (12:32) aage badhta hai
      - name: Wait for session 1 handover (12:32 IST)
        if: github.event.schedule == '37 4 * * 1-5' || github.event.schedule == '7 5 * * 1-5'
        run: |
          target=$(date -d "12:32" +%s); now=$(date +%s)
          if [ "$now" -lt "$target" ]; then sleep $((target-now)); fi

      - name: Restore today's chart history
        if: github.event.inputs.mode != 'test'
        uses: actions/cache/restore@v4
        with:
          path: oi_history_*.pkl
          key: hist-${{ env.D }}-${{ github.run_id }}
          restore-keys: |
            hist-${{ env.D }}-
            hist-

      - name: Run tracker
        if: github.event.inputs.mode != 'test'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          case "${{ github.event.schedule }}" in
            "37 1 * * 1-5"|"7 2 * * 1-5") python run_actions.py --until 12:30 ;;
            *) python run_actions.py --until 15:42 ;;
          esac

      - name: Prune old chart history (last 6 din rakho)
        if: github.event.inputs.mode != 'test' && always()
        run: ls -1 oi_history_*.pkl 2>/dev/null | sort | head -n -6 | xargs -r rm -f || true

      - name: Save today's chart history
        if: github.event.inputs.mode != 'test' && always()
        uses: actions/cache/save@v4
        with:
          path: oi_history_*.pkl
          key: hist-${{ env.D }}-${{ github.run_id }}
