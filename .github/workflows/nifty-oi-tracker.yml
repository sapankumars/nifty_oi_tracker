name: nifty-oi-tracker

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test = sirf NSE access check | run = asli tracker"
        default: "test"
      until:
        description: "run mode me: 12:30 (session 1) ya 15:42 (session 2). Khali = schedule se tay hoga"
        default: ""
  schedule:
    # GitHub cron UTC me hota hai (IST = UTC + 5:30).
    # NOTE: GitHub scheduled runs 4-9 ghante late ho rahe hain (19-Nov: backup run 21:10 IST par chala).
    # Isliye asli trigger bahar se aata hai: cron-job.org -> workflow_dispatch API
    #   09:05 IST -> mode=run, until=12:30   (session 1)
    #   12:25 IST -> mode=run, until=15:42   (session 2)
    # Neeche ke cron sirf BACKUP hain (late chale to run_actions 'deadline already passed' bol kar nikal jata hai).
    - cron: "7 2 * * 1-5"    # 07:37 IST  session 1 backup
    - cron: "37 2 * * 1-5"   # 08:07 IST  session 1 backup
    - cron: "37 5 * * 1-5"   # 11:07 IST  session 2 backup
    - cron: "7 6 * * 1-5"    # 11:37 IST  session 2 backup

concurrency:
  # test mode alag group me (asli session ko kabhi nahi rokta);
  # dispatch me 'until' se session tay hota hai, schedule me cron se
  group: nifty-${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'test') && 'test' || (github.event.inputs.until == '12:30' && 'session1') || (github.event.inputs.until == '15:42' && 'session2') || ((github.event.schedule == '7 2 * * 1-5' || github.event.schedule == '37 2 * * 1-5') && 'session1' || 'session2') }}
  cancel-in-progress: false

env:
  TZ: Asia/Kolkata

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests pandas openpyxl matplotlib numpy

      - name: Today's date
        run: echo "D=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      # ---- TEST MODE: sirf dekhta hai ki GitHub se NSE khulta hai ya nahi ----
      - name: NSE access test
        if: github.event.inputs.mode == 'test'
        run: python nse_to_excel.py --test

      # ---- RUN MODE ----
      # Session 1: market open (09:10 IST) tak wait (STARTED msg open ke aas-paas aaye)
      - name: Wait for market open (09:10 IST) - session 1
        if: github.event.schedule == '7 2 * * 1-5' || github.event.schedule == '37 2 * * 1-5' || (github.event.inputs.mode == 'run' && github.event.inputs.until == '12:30')
        run: |
          target=$(date -d "09:10" +%s); now=$(date +%s)
          if [ "$now" -lt "$target" ]; then sleep $((target-now)); fi

      # Session 2: session 1 ka history-cache save hone ke baad (12:32) aage badhta hai
      - name: Wait for session 1 handover (12:32 IST)
        if: github.event.schedule == '37 5 * * 1-5' || github.event.schedule == '7 6 * * 1-5' || (github.event.inputs.mode == 'run' && github.event.inputs.until == '15:42')
        run: |
          target=$(date -d "12:32" +%s); now=$(date +%s)
          if [ "$now" -lt "$target" ]; then sleep $((target-now)); fi

      - name: Restore today's chart history
        id: restore
        if: github.event.inputs.mode != 'test'
        uses: actions/cache/restore@v4
        with:
          path: oi_history_*.pkl
          key: hist-${{ env.D }}-${{ github.run_id }}
          restore-keys: |
            hist-${{ env.D }}-
            hist-

      # Session 2: agar aaj ka cache nahi mila (session 1 ka save abhi ho raha ho) to 45s ruk kar ek baar aur try
      - name: Handover retry - wait
        if: github.event.inputs.mode != 'test' && (github.event.schedule == '37 5 * * 1-5' || github.event.schedule == '7 6 * * 1-5' || github.event.inputs.until == '15:42') && !startsWith(steps.restore.outputs.cache-matched-key, format('hist-{0}-', env.D))
        run: sleep 45

      - name: Handover retry - restore
        if: github.event.inputs.mode != 'test' && (github.event.schedule == '37 5 * * 1-5' || github.event.schedule == '7 6 * * 1-5' || github.event.inputs.until == '15:42') && !startsWith(steps.restore.outputs.cache-matched-key, format('hist-{0}-', env.D))
        uses: actions/cache/restore@v4
        with:
          path: oi_history_*.pkl
          key: hist-${{ env.D }}-${{ github.run_id }}
          restore-keys: |
            hist-${{ env.D }}-

      - name: Run tracker
        if: github.event.inputs.mode != 'test'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          U="${{ github.event.inputs.until }}"
          if [ -n "$U" ]; then
            python run_actions.py --until "$U"
          else
            case "${{ github.event.schedule }}" in
              "7 2 * * 1-5"|"37 2 * * 1-5") python run_actions.py --until 12:30 ;;
              *) python run_actions.py --until 15:42 ;;
            esac
          fi

      - name: Prune old chart history (last 6 din rakho)
        if: github.event.inputs.mode != 'test' && always()
        run: ls -1 oi_history_*.pkl 2>/dev/null | sort | head -n -6 | xargs -r rm -f || true

      # Cache sirf tab save hota hai jab tracker asli me chala (backup / late / holiday run ka bekaar cache nahi banta)
      - name: Save today's chart history
        if: github.event.inputs.mode != 'test' && always() && hashFiles('tracker_ran.flag') != ''
        uses: actions/cache/save@v4
        with:
          path: oi_history_*.pkl
          key: hist-${{ env.D }}-${{ github.run_id }}

      # Debug ke liye run ka tracker_log.txt (Actions -> run -> Artifacts)
      - name: Upload tracker log
        if: github.event.inputs.mode != 'test' && always()
        uses: actions/upload-artifact@v4
        with:
          name: tracker-log-${{ env.D }}-${{ github.run_id }}
          path: tracker_log.txt
          retention-days: 3
          if-no-files-found: ignore
